name: "CLA"

# Asks every outside contributor to sign CONTRIBUTOR_LICENSE_AGREEMENT.md once,
# by commenting on their pull request. Signatures are committed to
# signatures/cla.json in the private rustrak/cla-signatures repository, written
# with the PERSONAL_ACCESS_TOKEN secret. pull_request_target runs this file as
# it is on main and never checks out the PR's code.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: read
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request_target' || github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'
    steps:
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        with:
          path-to-document: "https://github.com/rustrak/rustrak/blob/main/CONTRIBUTOR_LICENSE_AGREEMENT.md"
          path-to-signatures: "signatures/cla.json"
          branch: "main"
          remote-organization-name: "rustrak"
          remote-repository-name: "cla-signatures"
          allowlist: "AbianS,*[bot]"
